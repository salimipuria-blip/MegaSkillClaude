# Local-only hooks (hermes/#028, #065): no downloads, no network, no remote repos.
# Every hook degrades to "skipped" when its tool is absent, so the repo stays
# usable on a machine without the audit toolchain.
# Install: pipx install pre-commit && pre-commit install
# Toolchain: python3 -m venv .venv && . .venv/bin/activate
#            pip install semgrep bandit detect-secrets zizmor
# Full local audit: bash scripts/audit/run_scans.sh
repos:
  - repo: local
    hooks:
      - id: no-env-files
        name: Block committed .env files (examples only)
        entry: >-
          bash -c 'for f in "$@"; do case "$f" in *.example) ;; *) echo blocked-env-file >&2; exit 1;; esac; done' --
        language: system
        files: (^|/)\.env(\..*)?$
      - id: hermes-shell-syntax
        name: Hermes shell syntax
        entry: bash -n hermes/setup.sh hermes/config.sh hermes/logger.sh
        language: system
        files: ^hermes/.*\.sh$
        pass_filenames: false
      - id: repository-contract
        name: Repository contract (secret shapes)
        entry: python3 orchestrator/scripts/audit/check_repository_contract.py
        language: system
        pass_filenames: false
      - id: audit-contract
        name: Audit contract (action pinning, headers, provenance)
        entry: python3 -m unittest tests.test_audit_contract
        language: system
        pass_filenames: false
        files: ^(\.github/|psk/(api|vercel\.json)|library/github-skills/(INDEX|PROVENANCE)\.json|tests/test_audit_contract\.py|docs/audit/|LICENSE|SECURITY\.md)
      - id: secrets-baseline
        name: No new secrets against .secrets.baseline
        entry: bash -c 'command -v detect-secrets-hook >/dev/null 2>&1 || exit 0; detect-secrets-hook --baseline .secrets.baseline "$@"' --
        language: system
        types: [text]
      - id: semgrep-project-rules
        name: Semgrep (project rules, changed files)
        entry: bash -c 'command -v semgrep >/dev/null 2>&1 || exit 0; SEMGREP_SEND_METRICS=off semgrep scan --config .semgrep/rules.yml --severity ERROR --error --quiet "$@"' --
        language: system
        types: [javascript, python, shell, yaml]
      - id: workflow-action-pins
        name: Actions must be pinned to a commit SHA
        entry: bash -c 'python3 -m unittest tests.test_audit_contract.WorkflowPinning' --
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
