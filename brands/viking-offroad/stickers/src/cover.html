<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Lalezar; src: url(Lalezar.woff2) format('woff2'); }
@font-face { font-family: RubikDirt; src: url(RubikDirt.woff2) format('woff2'); }
html, body { margin: 0; background: transparent; }
svg { display: block; }
.fa { font-family: Lalezar; direction: rtl; }
.en { font-family: RubikDirt; }
</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e2"/><stop offset="0.55" stop-color="#f3dfb8"/><stop offset="1" stop-color="#d9b680"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b65c"/><stop offset="0.5" stop-color="#d9772a"/><stop offset="1" stop-color="#9c4a17"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a24"/><stop offset="1" stop-color="#a8692f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#9aa2aa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1c0f06" flood-opacity="0.55"/>
    </filter>
    <g id="axe">
      <rect x="-9" y="-150" width="18" height="300" rx="8" fill="url(#wood)" stroke="#2e1a0c" stroke-width="7"/>
      <path d="M 6 -150 C 70 -175 110 -120 105 -60 C 70 -80 40 -78 6 -70 Z" fill="url(#steel)" stroke="#2e1a0c" stroke-width="7" stroke-linejoin="round"/>
      <rect x="-12" y="-80" width="24" height="18" rx="4" fill="#5a3418" stroke="#2e1a0c" stroke-width="5"/>
    </g>
    <g id="tire">
      <circle r="70" fill="#4a2d1a" stroke="#2a170b" stroke-width="8"/>
      <circle r="70" fill="none" stroke="#6b4228" stroke-width="10" stroke-dasharray="14 12"/>
      <circle r="34" fill="#2a170b"/>
      <circle r="18" fill="#8b5a32"/>
    </g>
    <g id="compass">
      <circle r="38" fill="#e9dcc0" stroke="#4a2d1a" stroke-width="7"/>
      <circle r="28" fill="none" stroke="#8b5a32" stroke-width="3"/>
      <path d="M 0 -26 L 7 0 L 0 26 L -7 0 Z" fill="#b8431e" stroke="#4a2d1a" stroke-width="3"/>
      <circle r="4" fill="#4a2d1a"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <!-- tire tracks -->
    <g opacity="0.85" stroke="#5c3a20" stroke-width="16" stroke-dasharray="26 18" fill="none" stroke-linecap="round">
      <path d="M 210 470 C 520 420 1080 420 1390 470"/>
      <path d="M 230 520 C 540 470 1060 470 1370 520"/>
    </g>

    <!-- mountains -->
    <g stroke="#3b2414" stroke-width="8" stroke-linejoin="round">
      <path d="M 520 205 L 640 70 L 760 205 Z" fill="#a8622c"/>
      <path d="M 700 205 L 800 40 L 900 205 Z" fill="#c07436"/>
      <path d="M 840 205 L 960 80 L 1080 205 Z" fill="#a8622c"/>
      <path d="M 612 102 L 640 70 L 668 102 L 652 96 L 640 108 L 628 96 Z" fill="#f6ecd8"/>
      <path d="M 772 86 L 800 40 L 828 86 L 812 78 L 800 92 L 788 78 Z" fill="#f6ecd8"/>
      <path d="M 932 110 L 960 80 L 988 110 L 972 104 L 960 116 L 948 104 Z" fill="#f6ecd8"/>
    </g>

    <!-- axes -->
    <use href="#axe" transform="translate(180 330) rotate(-28)"/>
    <use href="#axe" transform="translate(1420 330) rotate(28) scale(-1 1)"/>

    <!-- tires & compasses -->
    <use href="#tire" transform="translate(170 785)"/>
    <use href="#tire" transform="translate(1430 785)"/>
    <use href="#compass" transform="translate(300 640)"/>
    <use href="#compass" transform="translate(1300 640)"/>

    <!-- line 1 -->
    <text class="fa" x="800" y="285" text-anchor="middle" font-size="150"
          fill="url(#cream)" stroke="#3b2414" stroke-width="22" paint-order="stroke" stroke-linejoin="round">اگه گفتی</text>

    <!-- line 2 -->
    <text class="fa" x="800" y="505" text-anchor="middle" font-size="210"
          fill="url(#orange)" stroke="#3b2414" stroke-width="26" paint-order="stroke" stroke-linejoin="round">جای چی خالیه؟؟؟</text>

    <!-- line 3 -->
    <text class="fa" x="800" y="640" text-anchor="middle" font-size="92"
          fill="url(#cream)" stroke="#3b2414" stroke-width="16" paint-order="stroke" stroke-linejoin="round">سر میز صبحونهٔ</text>

    <!-- brand row: viking [helmet] offroad -->
    <text class="en" x="700" y="825" text-anchor="end" font-size="112"
          fill="url(#orange)" stroke="#3b2414" stroke-width="18" paint-order="stroke" stroke-linejoin="round">viking</text>
    <g transform="translate(800 800) scale(0.8)">
      <path d="M -58 -20 C -110 -40 -120 -95 -95 -120 C -92 -80 -70 -55 -40 -48 Z" fill="#efe2c4" stroke="#3b2414" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 58 -20 C 110 -40 120 -95 95 -120 C 92 -80 70 -55 40 -48 Z" fill="#efe2c4" stroke="#3b2414" stroke-width="8" stroke-linejoin="round"/>
      <path d="M -62 20 C -62 -50 62 -50 62 20 Z" fill="url(#steel)" stroke="#3b2414" stroke-width="9"/>
      <rect x="-68" y="12" width="136" height="20" rx="6" fill="#b06a2f" stroke="#3b2414" stroke-width="7"/>
      <rect x="-8" y="-42" width="16" height="96" rx="5" fill="#b06a2f" stroke="#3b2414" stroke-width="7"/>
    </g>
    <text class="en" x="900" y="825" text-anchor="start" font-size="112"
          fill="url(#orange)" stroke="#3b2414" stroke-width="18" paint-order="stroke" stroke-linejoin="round">offroad</text>
  </g>
</svg>
</body></html>
