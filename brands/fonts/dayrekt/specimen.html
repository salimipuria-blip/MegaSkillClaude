<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Dayrekt"; font-weight: 300; src: url(fonts/Dayrekt-Light.woff2); }
@font-face { font-family: "Dayrekt"; font-weight: 400; src: url(fonts/Dayrekt-Regular.woff2); }
@font-face { font-family: "Dayrekt"; font-weight: 500; src: url(fonts/Dayrekt-Medium.woff2); }
@font-face { font-family: "Dayrekt"; font-weight: 700; src: url(fonts/Dayrekt-Bold.woff2); }
body { margin: 0; width: 1600px; background: #fff; color: #111; font-family: "Dayrekt"; }
.wrap { padding: 90px 100px; }
.hero { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid #111; padding-bottom: 40px; }
.hero h1 { font-size: 230px; font-weight: 400; margin: 0; line-height: 1.1; }
.hero .lat { font-size: 120px; direction: ltr; }
.row { display: flex; gap: 60px; align-items: baseline; border-bottom: 1px solid #ddd; padding: 26px 0; }
.tag { font-size: 34px; color: #F28A1E; width: 200px; flex: none; direction: ltr; text-align: left; }
.big { font-size: 96px; line-height: 1.5; }
.mid { font-size: 64px; line-height: 1.6; }
.dash { display: inline-block; width: 140px; height: 14px; background: #F28A1E; margin: 0 10px; vertical-align: middle; }
</style></head><body><div class="wrap">
<div class="hero"><h1>دایرکت</h1><div class="lat">DAYREKT</div></div>
<div class="row"><div class="tag">Light 300</div><div class="big" style="font-weight:300">امشب زیر آسمون پرستاره</div></div>
<div class="row"><div class="tag">Regular 400</div><div class="big" style="font-weight:400">همین الان دایرکت بده</div></div>
<div class="row"><div class="tag">Medium 500</div><div class="big" style="font-weight:500">کمپ آخر هفته با وایکینگ</div></div>
<div class="row"><div class="tag">Bold 700</div><div class="big" style="font-weight:700">ویدیوی جدید منتشر شد</div></div>
<div class="row"><div class="tag">Letters</div><div class="mid">ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی</div></div>
<div class="row"><div class="tag">Digits</div><div class="mid">۰۱۲۳۴۵۶۷۸۹ — 0123456789 ؟ ! « » ، ٪</div></div>
<div class="row"><div class="tag">Latin</div><div class="mid" style="direction:ltr">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div></div>
</div></body></html>
