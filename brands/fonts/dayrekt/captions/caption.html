<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Dayrekt caption template: edit SCENES below, then `node render.mjs` (see README). -->
<style>
@font-face { font-family: "Dayrekt"; font-weight: 300; src: url(../fonts/Dayrekt-Light.woff2) format("woff2"); }
@font-face { font-family: "Dayrekt"; font-weight: 400; src: url(../fonts/Dayrekt-Regular.woff2) format("woff2"); }
@font-face { font-family: "Dayrekt"; font-weight: 500; src: url(../fonts/Dayrekt-Medium.woff2) format("woff2"); }
@font-face { font-family: "Dayrekt"; font-weight: 700; src: url(../fonts/Dayrekt-Bold.woff2) format("woff2"); }
:root { --accent: #F28A1E; --ink: #111; --paper: #fff; }
html, body { margin: 0; background: #000; }
#stage { position: fixed; inset: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform-origin: 50% 40%; }
.shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 45%); }
.cap { position: absolute; left: 70px; right: 70px; top: 1250px; display: flex; flex-direction: column; align-items: center; gap: 22px; font-family: "Dayrekt"; }
.line { position: relative; display: flex; flex-direction: row; gap: 0.32em; white-space: nowrap; }
.w { display: inline-block; opacity: 0; }

/* style 1 — "dash": white words, orange dash slides under the spoken word (dots of the font are dashes too) */
.dash .line { font-size: 112px; font-weight: 500; color: var(--paper); text-shadow: 0 3px 22px rgba(0,0,0,.55); }
.dash .w.past { color: rgba(255,255,255,.78); }
.dash .bar { position: absolute; height: 12px; background: var(--accent); bottom: -26px; border-radius: 0; }

/* style 2 — "label": black on white like the reference artwork, the box grows word by word */
.label .line { font-size: 96px; font-weight: 400; color: var(--ink); padding: 18px 34px 30px; }
.label .box { position: absolute; top: 0; bottom: 0; right: 0; background: var(--paper); z-index: -1; }
.label .w.now { color: var(--accent); }
.label .line { z-index: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// Each scene: background, caption style, and lines of [startSeconds, word].
const SCENES = [
  { from: 0, to: 3.2, bg: "bg2.jpg", style: "dash", lines: [
      [[0.25, "امشب"], [0.55, "زیر"], [0.85, "آسمون"], [1.25, "پرستاره"]],
      [[1.75, "کمپ"], [2.1, "می‌زنیم"]] ] },
  { from: 3.2, to: 6.4, bg: "bg1.jpg", style: "label", lines: [
      [[3.45, "جا"], [3.7, "محدوده"]],
      [[4.2, "همین"], [4.5, "الان"], [4.9, "دایرکت"], [5.3, "بده"]] ] },
];
const FADE = 0.3, IN = 0.18;
const stage = document.getElementById("stage");
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);

for (const sc of SCENES) {
  sc.img = Object.assign(document.createElement("img"), { src: sc.bg, className: "bg" });
  stage.append(sc.img);
}
stage.append(Object.assign(document.createElement("div"), { className: "shade" }));
for (const sc of SCENES) {
  sc.el = Object.assign(document.createElement("div"), { className: "cap " + sc.style });
  sc.words = [];
  for (const ln of sc.lines) {
    const line = Object.assign(document.createElement("div"), { className: "line" });
    const deco = Object.assign(document.createElement("div"), { className: sc.style === "dash" ? "bar" : "box" });
    line.append(deco);
    line.words = [];
    for (const [t, text] of ln) {
      const w = Object.assign(document.createElement("span"), { className: "w", textContent: text });
      w.t = t; line.append(w); line.words.push(w); sc.words.push(w);
    }
    line.deco = deco;
    sc.el.append(line);
  }
  stage.append(sc.el);
}

window.seek = (t) => {
  for (const sc of SCENES) {
    const on = t >= sc.from - FADE && t < sc.to;
    const a = on ? Math.min(ease((t - sc.from + FADE) / FADE), ease((sc.to - t) / FADE)) : 0;
    sc.img.style.opacity = a;
    sc.img.style.transform = `scale(${1 + 0.07 * Math.min(Math.max((t - sc.from) / (sc.to - sc.from), 0), 1)})`;
    sc.el.style.opacity = a;
    const spoken = sc.words.filter(w => w.t <= t);
    const now = spoken[spoken.length - 1];
    for (const line of sc.el.querySelectorAll(".line")) {
      for (const w of line.words) {
        const k = ease((t - w.t) / IN);
        w.style.opacity = k;
        w.style.transform = `translateY(${(1 - k) * 22}px)`;
        w.classList.toggle("now", w === now);
        w.classList.toggle("past", w.t <= t && w !== now);
      }
      const lineBox = line.getBoundingClientRect();
      const shown = line.words.filter(w => w.t <= t);
      if (sc.style === "dash") {
        const cur = line.words.includes(now) ? now : null;
        if (!cur) { line.deco.style.width = "0px"; continue; }
        const i = line.words.indexOf(cur), prev = line.words[i - 1];
        const k = ease((t - cur.t) / 0.16);
        const r = cur.getBoundingClientRect(), p = prev ? prev.getBoundingClientRect() : r;
        const left = p.left + (r.left - p.left) * k, width = p.width + (r.width - p.width) * k;
        line.deco.style.left = (left - lineBox.left) + "px";
        line.deco.style.width = width + "px";
      } else {
        if (!shown.length) { line.deco.style.width = "0px"; continue; }
        // RTL: the box grows leftwards from the right edge of the line
        const last = shown[shown.length - 1], k = ease((t - last.t) / IN);
        const prev = shown[shown.length - 2];
        const edge = (el) => lineBox.right - el.getBoundingClientRect().left + 34;
        const target = edge(last), from = prev ? edge(prev) : 0;
        line.deco.style.width = (from + (target - from) * k) + "px";
      }
    }
  }
};
window.DURATION = SCENES[SCENES.length - 1].to;
seek(0);
</script>
</body>
</html>
