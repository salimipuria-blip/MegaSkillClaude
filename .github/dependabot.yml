version: 2
updates:
  # Actual runnable project manifests only; ignore vendored skill examples.
  # No root npm manifest or orchestrator pip manifest exists.
  - package-ecosystem: "npm"
    directory: "/psk"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/lithos"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/fjcod"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/bison-brand-book"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/hermes"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/viking-team/motion"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
