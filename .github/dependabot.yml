version: 2
updates:
  # Actual runnable project manifests only; ignore vendored skill examples.
  # No root npm manifest or orchestrator pip manifest exists.
  - package-ecosystem: "npm"
    directory: "/psk"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/lithos"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/fjcod"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/bison-brand-book"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/hermes"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/viking-team/motion"
    schedule:
      interval: "weekly"
    # remotion and @remotion/cli must carry the same exact version, which
    # viking-team/motion/tests/composition.test.mjs asserts twice (equality, and a
    # ^\d+\.\d+\.\d+$ pin). One PR per package therefore always fails that test, which
    # is why #105 and #107 sit UNSTABLE: group them so both move together.
    groups:
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
  - package-ecosystem: "npm"
    directory: "/brands/viking-offroad/stickers/src"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
