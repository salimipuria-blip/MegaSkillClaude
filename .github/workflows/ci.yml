name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repo health check (no dependency installation)
        run: bash scripts/repo_health_check.sh
      - name: Repository normalization regressions
        run: python -m unittest discover -s tests -p "test_repo_normalization.py" -v
      - name: Mobile PWA contracts, weight budget and search tests
        run: |
          python3 mobile/build-index.py --check
          node --check mobile/app.js
          node --check mobile/sw.js
          node --check mobile/search.mjs
          node --test mobile/search.test.mjs mobile/index.test.mjs
      - name: Brand asset contracts, sticker manifest and renderer syntax
        run: |
          python3 scripts/check_brand_assets.py
          python3 scripts/build_sticker_manifest.py --check
          node --check brand/viking/render.mjs
          node --test brand/viking/tests/render.test.mjs
          node --test brand/viking/tests/content.test.mjs
      - name: Verify the project doctor really discovers quoted Python test patterns
        run: node --test tests/doctor.test.mjs
      - name: Supabase readiness checker (mocked fetch, no network, no credentials)
        run: |
          node --check scripts/check-supabase.mjs
          node scripts/check-supabase.mjs --expected-only
          node --test tests/check-supabase.test.mjs

  psk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require ENGINE_TOKEN for main branch builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN:-}" ]; then
            echo "ENGINE_TOKEN secret is not set for repo. Aborting CI." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test

  lithos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lithos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check api/buffer-sync.js
      - run: npm test
      - run: npm run build

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_skill_library.py --check
      # Backlog task 17: the imported third-party instructions are scanned for prompt-injection and
      # remote-code patterns; the committed library/SECURITY_SCAN.md must be what a fresh scan yields.
      - name: Third-party skill instruction scan is current
        run: python3 scripts/scan_third_party_skills.py --check
      # Backlog task 90: a skill whose SKILL.md promises a companion file that is not there must be
      # flagged `incomplete`, so the router never hands out instructions that dead-end.
      - name: Imported skill links are flagged or justified
        run: python3 scripts/check_skill_links.py --check
      - name: Skill quality report is current
        run: python3 scripts/report_skill_quality.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  fjcod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fjcod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  bison-brand-book:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bison-brand-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Static contract (asset paths, anchors, ZIP, reduced motion)
        run: npm test
      - run: npm run build

  # Ported from viking-team/.github/workflows/viking-team-static-check.yml
  viking-team:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viking-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Media behavior regressions
        run: node --test tests/*.test.mjs
      - name: Validate browser module syntax
        run: node --check --input-type=module < team/app.js
      - name: Run dependency-free integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate app entry, CSS references and no secret keys
        run: |
          test -s team/index.html
          test -s team/styles.css
          test -s team/app.js
          grep -q 'src="./app.js"' team/index.html
          grep -q 'href="./styles.css"' team/index.html
          grep -q 'viking_trip_media' team/app.js
          grep -q 'viking_team_members' team/app.js
          ! grep -R -E 'service_role|sb_secret_' team

  viking-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the isolated motion-study dependencies
        run: npm ci --prefix viking-team/motion --ignore-scripts --no-audit --no-fund
      - name: Typecheck Remotion composition
        run: npm run check --prefix viking-team/motion
      - name: Composition spec lock (geometry, fps, palette, no CSS animation)
        run: npm test --prefix viking-team/motion

  # Real browser smoke of the store: login per role, a POS sale, closing a shift.
  # E2E_STRICT=1 turns a missing browser into a failure instead of a silent skip.
  fjcod-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fjcod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser smoke (desktop + 390x844 mobile viewport)
        env:
          E2E_STRICT: "1"
        run: npm run e2e

  # Ported from orchestrator/.github/workflows/baseline-ci.yml (kept there: its contract test reads it)
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GitHub admin authorization regressions
        run: node --test supabase/functions/github-admin-gateway/*.test.mjs
      # Backlog task 94: the free-LLM-mesh verifier's SSRF and DNS-rebinding guard had tests that no
      # CI job ever ran, so a regression in resolveHostPublic() would have shipped silently.
      - name: Free LLM mesh SSRF and DNS-rebinding regressions
        run: node --test supabase/functions/github-llm-verifier/*.test.mjs
      - name: Native Deno gateway check and regressions (no network)
        run: |
          deno check --no-remote supabase/functions/github-admin-gateway/index.ts
          deno test --no-remote --no-prompt supabase/functions/github-admin-gateway/handler.test.mjs
      - name: Repository guard
        run: python scripts/audit/check_repository_contract.py
      - name: Python contracts
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q -ra tests
      - name: Deno deployability checks
        shell: bash
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            (
              cd "$(dirname "$entry")"
              tmp=.ci-check.ts
              trap 'rm -f "$tmp"' EXIT
              { printf '// @ts-nocheck\n'; cat index.ts; } > "$tmp"
              deno check "$tmp"
            )
          done

  hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n hermes/setup.sh
      - run: shellcheck -S warning hermes/setup.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix hermes --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix hermes
      - run: npm test --prefix hermes
      - name: SQLite distributed-memory regressions (local workerd, no network)
        run: npm run test:integration --prefix hermes
      - name: Build Mega Skills assets
        run: |
          node hermes/build-skills.mjs | tee build.log
          grep -Eq "\] [0-9]{4,} skills" build.log


  commit-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Backlog task 98. Only commit *messages* are read, so a blobless full history keeps this
          # job short while still letting the range below resolve on a pull request.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No model identity in this branch's commit messages
        run: >-
          python3 scripts/check_commit_identity.py
          --range "origin/${{ github.base_ref || github.event.repository.default_branch }}...HEAD"
      - name: No model identity in the pull request text
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY"
          | python3 scripts/check_commit_identity.py
          --stdin "pull request #${{ github.event.pull_request.number }}"
      - name: Identity-checker regressions
        run: python3 -m unittest tests.test_commit_identity -v
