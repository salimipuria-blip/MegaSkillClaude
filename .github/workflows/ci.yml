name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run repo health check (no dependency installation)
        run: bash scripts/repo_health_check.sh
      - name: Repository normalization regressions
        run: python -m unittest discover -s tests -p "test_repo_normalization.py" -v

  psk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci
    defaults:
      run:
        working-directory: psk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Require ENGINE_TOKEN for main branch builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN:-}" ]; then
            echo "ENGINE_TOKEN secret is not set for repo. Aborting CI." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test

  lithos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lithos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check api/buffer-sync.js
      - run: npm test
      - run: npm run build

  router:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/sync_skill_library.py --check
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  fjcod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fjcod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  bison-brand-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bison-brand-book
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # Ported from viking-team/.github/workflows/viking-team-static-check.yml
  viking-team:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viking-team
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Media behavior regressions
        run: node --test tests/*.test.mjs
      - name: Validate browser module syntax
        run: node --check --input-type=module < team/app.js
      - name: Run dependency-free integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate app entry, CSS references and no secret keys
        run: |
          test -s team/index.html
          test -s team/styles.css
          test -s team/app.js
          grep -q 'src="./app.js"' team/index.html
          grep -q 'href="./styles.css"' team/index.html
          grep -q 'viking_trip_media' team/app.js
          grep -q 'viking_team_members' team/app.js
          ! grep -R -E 'service_role|sb_secret_' team

  # Ported from orchestrator/.github/workflows/baseline-ci.yml (kept there: its contract test reads it)
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: GitHub admin authorization regressions
        run: node --test supabase/functions/github-admin-gateway/*.test.mjs
      - name: Native Deno gateway check and regressions (no network)
        run: |
          deno check --no-remote supabase/functions/github-admin-gateway/index.ts
          deno test --no-remote --no-prompt supabase/functions/github-admin-gateway/handler.test.mjs
      - name: Repository guard
        run: python scripts/audit/check_repository_contract.py
      - name: Python contracts
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q -ra tests
      - name: Deno deployability checks
        shell: bash
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            (
              cd "$(dirname "$entry")"
              tmp=.ci-check.ts
              trap 'rm -f "$tmp"' EXIT
              { printf '// @ts-nocheck\n'; cat index.ts; } > "$tmp"
              deno check "$tmp"
            )
          done

  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: bash -n hermes/setup.sh
      - run: shellcheck -S warning hermes/setup.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --prefix hermes --ignore-scripts --no-audit --no-fund
      - run: npm run check --prefix hermes
      - run: npm test --prefix hermes
      - name: SQLite distributed-memory regressions (local workerd, no network)
        run: npm run test:integration --prefix hermes
      - name: Build Mega Skills assets
        run: |
          node hermes/build-skills.mjs | tee build.log
          grep -Eq "\] [0-9]{4,} skills" build.log
