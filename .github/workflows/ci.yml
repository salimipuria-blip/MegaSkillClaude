name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  psk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test

  lithos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lithos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check api/buffer-sync.js
      - run: npm test
      - run: npm run build

  router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  fjcod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fjcod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  bison-brand-book:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bison-brand-book
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # Ported from viking-team/.github/workflows/viking-team-static-check.yml
  viking-team:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viking-team
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser module syntax
        run: node --check --input-type=module < team/app.js
      - name: Run dependency-free integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate app entry, CSS references and no secret keys
        run: |
          test -s team/index.html
          test -s team/styles.css
          test -s team/app.js
          grep -q 'src="./app.js"' team/index.html
          grep -q 'href="./styles.css"' team/index.html
          grep -q 'viking_trip_media' team/app.js
          grep -q 'viking_team_members' team/app.js
          ! grep -R -E 'service_role|sb_secret_' team

  # Ported from orchestrator/.github/workflows/baseline-ci.yml (kept there: its contract test reads it)
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Repository guard
        run: python scripts/audit/check_repository_contract.py
      - name: Python contracts
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q \
            tests/test_repository_contract.py \
            tests/test_function_manifest.py \
            tests/test_database_baseline_contract.py \
            tests/test_scanner_eligibility.py \
            tests/test_skill_orchestrator_contract.py \
            tests/test_verifier_hosted_precedence.py
      - name: Deno deployability checks
        shell: bash
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            (
              cd "$(dirname "$entry")"
              tmp=.ci-check.ts
              trap 'rm -f "$tmp"' EXIT
              { printf '// @ts-nocheck\n'; cat index.ts; } > "$tmp"
              deno check "$tmp"
            )
          done
