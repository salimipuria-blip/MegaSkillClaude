name: baseline-ci

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Repository guard
        run: python scripts/audit/check_repository_contract.py

      - name: Python contracts
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q \
            tests/test_repository_contract.py \
            tests/test_function_manifest.py \
            tests/test_database_baseline_contract.py \
            tests/test_scanner_eligibility.py \
            tests/test_skill_orchestrator_contract.py \
            tests/test_verifier_hosted_precedence.py

      - name: Deno checks
        shell: bash
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            (cd "$(dirname "$entry")" && deno check index.ts)
          done
