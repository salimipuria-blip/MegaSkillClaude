<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate Design System — Preview</title>
<link rel="stylesheet" href="tokens/css-variables.css">
<link rel="stylesheet" href="components/buttons.css">
<link rel="stylesheet" href="components/inputs.css">
<link rel="stylesheet" href="components/cards.css">
<style>
  body { font-family: var(--font-sans); background: var(--color-background); color: var(--color-text-primary); margin: 0; padding: var(--space-10); line-height: var(--line-height-normal); font-size: var(--text-sm); }
  .preview-section { max-width: 960px; margin: 0 auto; }
  h1 { font-size: var(--text-2xl); margin-bottom: var(--space-4); }
  h2 { font-size: var(--text-lg); margin-top: var(--space-10); margin-bottom: var(--space-4); color: var(--color-text-secondary); }
  p.lead { font-size: var(--text-sm); color: var(--color-text-muted); max-width: 80ch; }
  .btn-group-demo { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-8); }
  .field-demo { max-width: 420px; margin-bottom: var(--space-8); }
  .card-demo { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-bottom: var(--space-10); }
  .badge { margin-left: var(--space-2); }
  .code-note { font-family: var(--font-mono); font-size: var(--text-xs); background: var(--color-code-bg); color: var(--color-code); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); margin-top: var(--space-4); display: inline-block; }
</style>
</head>
<body>

<div class="preview-section">
  <h1>Slate</h1>
  <p class="lead">سیستم طراحی کدمحور، کثیف و فنی برای ابزارهای توسعه‌دهنده و پورتال‌های مستندات</p>

  <h2>دکمه‌ها و نوار ابزار</h2>
  <div class="btn-group-demo">
    <button class="btn btn-primary btn-md">Primary</button>
    <button class="btn btn-secondary btn-md">Secondary</button>
    <button class="btn btn-outline btn-md">Outline</button>
    <button class="btn btn-ghost btn-md">Ghost</button>
    <button class="btn btn-destructive btn-sm">Delete</button>
    <button class="btn btn-icon btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></button>
  </div>

  <div class="btn-toolbar" style="margin-top: var(--space-4);">
    <button class="btn btn-sm btn-outline">Save</button>
    <button class="btn btn-sm btn-primary">Deploy</button>
    <button class="btn btn-sm btn-ghost">Cancel</button>
  </div>

  <h2>ورودی‌ها</h2>
  <div class="field-demo">
    <label for="endpoint">Endpoint</label>
    <input type="text" id="endpoint" class="input" placeholder="/api/v1/users">
    <span class="helper-text">مثال: <span class="code-inline">GET /api/v1/users</span></span>
  </div>
  <div class="field-demo">
    <label for="timeout">Timeout (ms)</label>
    <input type="number" id="timeout" class="input error" value="5000">
    <p class="error-text">مقدار باید عدد صحیح باشد</p>
  </div>

  <h2>کارت‌ها</h2>
  <div class="card-demo">
    <article class="card card-interactive">
      <div class="card-header" style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted);">status-200</div>
      <div class="card-body">
        <h3 style="font-size: var(--text-base); margin: 0 0 var(--space-3) 0;">API Response</h3>
        <p style="font-size: var(--text-xs); color: var(--color-text-muted); margin: 0; font-family: var(--font-mono);">{"users": 124, "active": 89}</p>
      </div>
      <div class="card-footer">
        <span class="badge badge-success">ok</span>
        <button class="btn btn-xs btn-outline">view</button>
      </div>
    </article>
    <article class="card card-compact">
      <div class="card-body">
        <div style="display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: var(--text-xs);">
          <span>build_id</span>
          <span class="badge badge-info">v2.4.1</span>
        </div>
      </div>
    </article>
  </div>

  <div style="display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; margin-top: var(--space-8);">
    <span class="badge badge-default">stable</span>
    <span class="badge badge-primary">primary</span>
    <span class="badge badge-success">ok</span>
    <span class="badge badge-warning">warn</span>
    <span class="badge badge-error">err</span>
    <span class="badge badge-info">info</span>
    <div class="avatar avatar-md">SL</div>
  </div>
</div>

</body>
</html>
