<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Lalezar;src:url(assets/Lalezar.woff2)}
@font-face{font-family:Vazir;src:url(assets/Vazirmatn-Medium.woff2);font-weight:500}
@font-face{font-family:Vazir;src:url(assets/Vazirmatn-Bold.woff2);font-weight:700}
@font-face{font-family:Vazir;src:url(assets/Vazirmatn-Black.woff2);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Vazir;color:#fff}
#st{width:1080px;height:1920px;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:url(assets/visit-bg.jpg) 50% 42%/cover;filter:saturate(1.25) contrast(1.08)}
.sun{position:absolute;left:62%;top:30%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,170,60,.55),rgba(255,120,30,.15) 40%,transparent 65%);mix-blend-mode:screen}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 55%,rgba(0,0,0,.93) 70%,#000 100%)}
.tape{position:absolute;left:-60px;right:-60px;height:92px;background:#f39a2b;color:#141414;display:flex;align-items:center;justify-content:center;gap:40px;font:400 46px Lalezar;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.t1{top:96px;transform:rotate(-4deg)}
.t2{bottom:20px;height:80px;font-size:40px;transform:rotate(3deg);background:#fff}
.logo{position:absolute;top:230px;right:70px;width:150px;height:150px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.7))}
.hook{position:absolute;top:245px;left:70px;right:250px;font:900 44px/1.45 Vazir;text-shadow:0 4px 20px rgba(0,0,0,.85)}
.hook b{color:#ffb35c}
.head{position:absolute;top:930px;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.line1{font:400 118px/1.25 Lalezar;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.9)}
.line2{font:400 205px/1.05 Lalezar;color:#f39a2b;text-shadow:0 0 40px rgba(243,154,43,.55),0 8px 0 #000;letter-spacing:-2px}
.signoff{margin-top:30px;font:700 38px Vazir;color:#d8cfc2;text-shadow:0 4px 16px rgba(0,0,0,.9)}
</style></head><body><div id="st">
<div class="bg"></div><div class="sun"></div><div class="sh"></div>
<div class="tape t1">پایگاه وایکینگ آفرود&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;پایگاه وایکینگ آفرود</div>
<img class="logo" src="assets/logo.png" alt="">
<p class="hook">از خانواده بزرگ وایکینگ<br><b>یه خواهش کوچیک داریم</b></p>
<div class="head">
  <div class="line1">لطفا با هماهنگی قبلی</div>
  <div class="line2">تشریف بیارین</div>
  <div class="signoff">با احترام، تیم وایکینگ آفرود</div>
</div>
<div class="tape t2">ممنون از درک و همکاری شما</div>
</div></body></html>
