name: baseline-ci

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: GitHub admin authorization regressions
        run: node --test supabase/functions/github-admin-gateway/*.test.mjs
      - name: Native Deno gateway check and regressions (no network)
        run: |
          deno check --no-remote supabase/functions/github-admin-gateway/index.ts
          deno test --no-remote --no-prompt supabase/functions/github-admin-gateway/handler.test.mjs

      - name: Repository guard
        run: python scripts/audit/check_repository_contract.py

      - name: Python contracts
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest -q -ra tests

      - name: Deno deployability checks
        shell: bash
        run: |
          set -euo pipefail
          # Recovery keeps deployed source byte-for-byte. Some live functions are
          # JavaScript-style TypeScript and intentionally fail Deno's strict type
          # checker. Validate syntax/import resolution without rewriting live source.
          for entry in supabase/functions/*/index.ts; do
            (
              cd "$(dirname "$entry")"
              tmp=.ci-check.ts
              trap 'rm -f "$tmp"' EXIT
              { printf '// @ts-nocheck\n'; cat index.ts; } > "$tmp"
              deno check "$tmp"
            )
          done
